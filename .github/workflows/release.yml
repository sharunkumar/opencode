name: release

on:
  push:
    branches:
      - dev

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  # Guard so it can never double-release from upstream if this file is ever merged there.
  typecheck:
    if: github.repository != 'anomalyco/opencode'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Setup Bun
        uses: ./.github/actions/setup-bun

      - name: Run typecheck
        run: bun typecheck

  release:
    needs: typecheck
    if: github.repository != 'anomalyco/opencode'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Setup Bun
        uses: ./.github/actions/setup-bun

      # datever + short commit sha, e.g. 2026.6.18-a1b2c3d (non-padded for valid semver)
      - name: Compute version
        id: version
        run: echo "version=$(date -u +%Y.%-m.%-d)-${GITHUB_SHA:0:7}" >> "$GITHUB_OUTPUT"

      - name: Create draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="v${{ steps.version.outputs.version }}"
          gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 && exit 0
          gh release create "$tag" \
            --draft \
            --generate-notes \
            --target "$GITHUB_SHA" \
            --title "$tag" \
            --repo "$GITHUB_REPOSITORY"

      # Cross-compiles every target from this one runner and uploads
      # opencode-<os>-<arch>[-baseline][-musl].{zip,tar.gz} to the release.
      - name: Build and upload binaries
        run: bun ./packages/opencode/script/build.ts
        env:
          OPENCODE_VERSION: ${{ steps.version.outputs.version }}
          OPENCODE_RELEASE: "1"
          OPENCODE_CHANNEL: dev
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release edit "v${{ steps.version.outputs.version }}" --draft=false --latest --repo "$GITHUB_REPOSITORY"
